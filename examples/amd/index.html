<!doctype html>
<html>

<head>
  <title>AMD</title>
  <link rel="stylesheet" type="text/css" href="/javascript/bootstrap/css/bootstrap.min.css" />
</head>

<body class="container">
  <h1>AMD</h1>

  <div>
    <h3>User</h3>
    <div class="row">
      <img id="useravatar" src="" class="col-md-1" />
      <div class="col-md-3">
        <strong id="username"></strong>
      </div>
    </div>
  </div>

  <script src="/javascript/requirejs/require.min.js"></script>
  <script>
    requirejs.config({
      paths: {
        axios: '/axios.min'
      }
    });

    requirejs(['axios'], function (axios) {
      axios.get('https://api.github.com/users/mzabriskie')
        .then(function (user) {
          document.getElementById('useravatar').src = user.data.avatar_url;
          document.getElementById('username').innerHTML = user.data.name;
        });
    });
  </script>
</body>

</html>
